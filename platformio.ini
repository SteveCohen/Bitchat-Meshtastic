; Meshtastic-Bitchat Bridge
; Target: ESP32-S3 with WiFi (Meshtastic TCP) + BLE (Bitchat mesh)
;
; Two env variants:
;   esp32s3       — no PSRAM (ESP32-S3-DevKitC-1 N8, most common)
;   esp32s3-psram — with PSRAM (ESP32-S3-DevKitC-1 N8R8 / N16R8)
;
; Build: pio run -e esp32s3
; Flash: pio run -e esp32s3 -t upload
; Monitor: pio device monitor

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    ; S3 has native USB — Serial maps to USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Enable verbose boot logging
    -DCORE_DEBUG_LEVEL=3

[env:esp32s3]
extends = common
; No PSRAM — safe default for most DevKitC-1 boards

[env:esp32s3-psram]
extends = common
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
