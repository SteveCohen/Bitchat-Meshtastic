; Meshtastic-Bitchat Bridge
; Supported chips: ESP32-S3, ESP32-C6
;
; Environments:
;   esp32s3       — ESP32-S3-DevKitC-1 N8 (no PSRAM, most common)
;   esp32s3-psram — ESP32-S3-DevKitC-1 N8R8 / N16R8 (with PSRAM)
;   esp32c6       — ESP32-C6-DevKitC-1 (single-core RISC-V, WiFi 6 + BLE 5)
;
; Build: pio run -e esp32c6       (or esp32s3)
; Flash: pio run -e esp32c6 -t upload
; Monitor: pio device monitor

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0

build_flags =
    ; Enable verbose boot logging
    -DCORE_DEBUG_LEVEL=3

; ── ESP32-S3 ───────────────────────────────────────────
[common_s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    ; S3 has native USB OTG — Serial maps to USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:esp32s3]
extends = common_s3
; No PSRAM — safe default for most DevKitC-1 boards

[env:esp32s3-psram]
extends = common_s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common_s3.build_flags}
    -DBOARD_HAS_PSRAM

; Lolin / Wemos S3 Mini: ESP32-S3FH4R2, 4MB flash + 2MB QSPI PSRAM (NOT octal).
[env:esp32s3-lolin-mini]
extends = common_s3
board = lolin_s3_mini
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
build_flags =
    ${common_s3.build_flags}
    -DBOARD_HAS_PSRAM
    ; src/mbedtls_extras/{chacha20,chachapoly,poly1305,hkdf}.c — vendored
    ; from mbedtls v2.28.7. Needed because the Arduino-ESP32 prebuilt
    ; libmbedcrypto.a omits these modules; sdkconfig.defaults cannot
    ; enable them in a prebuilt lib. The mbedtls config headers shipped
    ; with the framework already #define the matching MBEDTLS_*_C macros
    ; unconditionally, so the vendored .c files compile their bodies.

; Same hardware as esp32s3-lolin-mini, but uses Meshtastic UDP-multicast
; instead of the TCP API. Requires `network.enabled_protocols=1` on the
; node and the channel PSK to match (see MESH_CHANNEL_PSK_HEX in config.h).
[env:esp32s3-lolin-mini-udp]
extends = env:esp32s3-lolin-mini
build_flags =
    ${env:esp32s3-lolin-mini.build_flags}
    -DMESHTASTIC_USE_UDP

; ── ESP32-C6 ───────────────────────────────────────────
[common_c6]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    ${common.build_flags}
    ; C6 uses USB-Serial/JTAG bridge (no OTG, so no USB_MODE flag)
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
extends = common_c6
