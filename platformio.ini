; Meshtastic-Bitchat Bridge
; Supported chips: ESP32-S3, ESP32-C6
;
; Environments:
;   esp32s3       — ESP32-S3-DevKitC-1 N8 (8 MB flash, no PSRAM)
;   esp32s3-n4    — ESP32-S3-DevKitC-1 N4 (4 MB flash, no PSRAM, common cheap variant)
;   esp32s3-psram — ESP32-S3-DevKitC-1 N8R8 / N16R8 (with PSRAM)
;   esp32c6       — ESP32-C6-DevKitC-1 (single-core RISC-V, WiFi 6 + BLE 5)
;
; Build: pio run -e esp32c6       (or esp32s3 / esp32s3-n4)
; Flash: pio run -e esp32c6 -t upload
; Monitor: pio device monitor

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    ; Enable verbose boot logging
    -DCORE_DEBUG_LEVEL=3

; ── ESP32-S3 ───────────────────────────────────────────
[common_s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    ; S3 has native USB OTG — Serial maps to USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:esp32s3]
extends = common_s3
; No PSRAM — safe default for most DevKitC-1 boards (assumes 8 MB flash)

[env:esp32s3-n4]
extends = common_s3
; 4 MB flash, no PSRAM. Cheap-clone variant of ESP32-S3-DevKitC-1
; (and many third-party S3 boards). Pinning flash_size keeps the
; binary header at 4 MB so the bootloader doesn't reject the image
; with "Detected size(4096k) smaller than ... binary image header".
; huge_app.csv = 3 MB app, ~1 MB SPIFFS, no OTA — plenty of room.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv

[env:esp32s3-psram]
extends = common_s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common_s3.build_flags}
    -DBOARD_HAS_PSRAM

; ── ESP32-C6 ───────────────────────────────────────────
[common_c6]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    ${common.build_flags}
    ; C6 uses USB-Serial/JTAG bridge (no OTG, so no USB_MODE flag)
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
extends = common_c6
